name: SwingBrasilia
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: SRN7AW424S
    APP_STORE_ID: "6813728967"
targets:
  SwingBrasilia:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
      - path: Resources/Catalog
        buildPhase: resources
      - path: Resources/Images
        buildPhase: resources
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.swingbrasilia.fun
        PRODUCT_NAME: "SwingBrasilia"
        PRODUCT_MODULE_NAME: SwingBrasilia
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Info.plist
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - SwingBrasiliaTests
  SwingBrasiliaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SwingBrasilia
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.com.swingbrasilia.fun.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SwingBrasilia.app/SwingBrasilia"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES
